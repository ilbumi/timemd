[package]
name         = "timemd-server"
description  = "HTTP API, reminder scheduler and embedded web UI for timemd."
version      .workspace = true
edition      .workspace = true
license      .workspace = true
rust-version .workspace = true
repository   .workspace = true

[dependencies]
timemd-core .workspace = true
chrono-tz   .workspace = true

axum       .workspace = true
chrono     .workspace = true
mime_guess .workspace = true
rust-embed .workspace = true
serde      .workspace = true
serde_json .workspace = true
thiserror  .workspace = true
tokio      .workspace = true
tower-http .workspace = true
tracing    .workspace = true
web-push = { version = "0.11", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
p256 = { version = "0.13", features = ["arithmetic"] }
base64 = "0.23"
rand = "0.8"
futures = "0.3"

[dev-dependencies]
http-body-util .workspace = true
tempfile       .workspace = true
tower          .workspace = true
