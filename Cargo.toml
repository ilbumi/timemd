[workspace]
members  = ["crates/core", "crates/server", "crates/mcp", "crates/cli"]
resolver = "3"

[workspace.package]
version      = "0.5.0"
edition      = "2024"
license      = "MIT"
rust-version = "1.89"
repository   = "https://github.com/ilbumi/timemd"

[workspace.dependencies]
timemd-core   = { path = "crates/core" }
timemd-server = { path = "crates/server" }
timemd-mcp    = { path = "crates/mcp" }

axum       = "0.8"
chrono     = { version = "0.4", features = ["serde"] }
chrono-tz  = { version = "0.10", features = ["serde"] }
clap       = { version = "4.6", features = ["derive", "env"] }
iana-time-zone = "0.1"
mime_guess = "2"
rust-embed = "8.12"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
tokio      = { version = "1", features = ["full"] }
tower      = "0.5"
tower-http = { version = "0.7", features = ["trace"] }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
web-push   = "0.11"
yaml_serde = "0.10"

# dev
http-body-util = "0.1"
proptest       = "1.11"
tempfile       = "3"

[profile.release]
lto       = true
strip     = true
codegen-units = 1
