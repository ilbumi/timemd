# Cut a release. Run it from the Actions tab; nothing here fires on its own.
#
# git-cliff reads the conventional commits since the last tag and decides the
# version — `cliff.toml` holds every rule it uses, and `git cliff --bumped-version`
# locally gives the same answer this workflow will. Run with `dry_run` first if
# you want to see the notes before anything is written.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version step. `auto` reads it from the commits."
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Report the version and notes, change nothing."
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false # never cancel a release with binaries half uploaded

env:
  CARGO_TERM_COLOR: always

jobs:
  # The layout suite gates the tag, the same as it gates a merge to main.
  e2e:
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  tag:
    name: version and tag
    needs: e2e
    # `needs` on a skipped job would skip this too, and a dry run wants no e2e.
    if: ${{ always() && (inputs.dry_run || needs.e2e.result == 'success') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff reads the whole history

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false # only `cargo update` runs here

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Work out the next version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          bump_arg=()
          [ "$BUMP" = auto ] || bump_arg=(--bump "$BUMP")
          tag="$(git cliff "${bump_arg[@]}" --bumped-version)"
          # Re-running with no new commits computes the tag that already exists.
          # Say so here rather than failing at `git tag` with the version and the
          # changelog already written.
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists — there is nothing new to release"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag"

      - name: Write the notes
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git cliff --tag "$TAG" --unreleased --strip all --output "$RUNNER_TEMP/notes.md"

      - name: Report and stop
        if: ${{ inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Dry run — nothing was written"
            echo
            echo "Next release would be \`$TAG\`."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set the version
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Only the version inside `[workspace.package]`, which every crate
          # inherits. The range keeps it away from any other `version =` line.
          sed -i -E "/^\[workspace\.package\]/,/^\[/ \
            s/^version([[:space:]]*)=[[:space:]]*\"[^\"]+\"/version\1= \"$VERSION\"/" Cargo.toml
          grep -qE "^version[[:space:]]*=[[:space:]]*\"$VERSION\"" Cargo.toml \
            || { echo "::error::the workspace version was not rewritten"; exit 1; }
          # Restricted to the four timemd packages, so no dependency moves.
          cargo update --workspace

      - name: Write the changelog
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # `--prepend` inserts one section into an existing file, so it needs
          # `--unreleased` to know which, and needs the file to exist. The first
          # release has neither, and writes the whole thing header and all.
          if [ -f CHANGELOG.md ]; then
            git cliff --tag "$TAG" --unreleased --prepend CHANGELOG.md
          else
            git cliff --tag "$TAG" --output CHANGELOG.md
          fi

      - name: Commit and tag
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD:main "$TAG"

      - name: Open the release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        # Draft until the binaries are attached, so nobody downloads an empty release.
        run: gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft

  binaries:
    needs: tag
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/build-binaries.yml
    permissions:
      contents: write
    with:
      tag: ${{ needs.tag.outputs.tag }}
      upload: true

  publish:
    name: publish the release
    needs: [tag, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Un-draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
