# The container image, built from the binaries a release already published
# rather than from source — see the Dockerfile for why.
#
# Callable on its own so the image can be exercised against any existing tag
# without cutting a release: `gh workflow run build-image.yml --ref main
# -f tag=v0.1.0 -f push=false`. That works because the binaries come from the
# release assets, not from another run's artifacts.
name: build-image

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      push:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose binaries go into the image."
        required: true
        type: string
      push:
        description: "Publish to ghcr.io. Off by default so a dispatch is a rehearsal."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  image:
    name: ghcr.io image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # A draft release is only visible to push-level access, and during a
      # release run that is exactly what this job reads from. `contents: read`
      # would 404 on the very case that matters.
      contents: write
      packages: write # only the push step needs this
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: docker/setup-buildx-action@v3

      # `make image` stages the binaries into dist/image, builds the host
      # architecture and proves the result runs — the same command a contributor
      # runs on a laptop, so what CI checks is not written twice. The push below
      # reuses the directory it staged.
      #
      # The release is the source of truth for what shipped, so the image cannot
      # contain a binary the tarball does not. During a release run these assets
      # are on the still-draft release the `binaries` job just uploaded to.
      - run: make image TAG="${{ inputs.tag }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - uses: docker/login-action@v3
        if: inputs.push
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The version is only ever the tag the release job decided on, the same
      # rule the tarball names follow.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: dist/image
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
